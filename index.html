<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPONDS!!!!❤️</title>
    <style>
        {
        box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);

        }
        .container {
            text-align: center;
            color: white;
            width:100%;
            max-width:500px;
            padding:20px;
        }
        h1 {
            font-size: 32px;
            margin:0 0 10px 0;
        }
        .sous-titre{
            margin-bottom: 50px;
            font-size: 18px;
        }
        .envelope {
            width: 300px;
            height: 200px;
            background: #fff;
            margin: 0 auto;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            cursor: pointer;
            perspective: 800px;


        }
        .envelope-body{
            position: absolute;
            bottom:0;
            width:100%;
            height:100%;
            background:#ffffff;
            border-radius:10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .left-fold {

            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 150px solid #ffb6c9;
        }
        .right-fold {

            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-right: 150px solid #ffb6c9;
        }
        .flap {

            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #ff4f70;
            transform-origin: top;
            transition: transform 0.8s ease;
            z-index: 5;
            .letter{
                position: absolute;
                width: 250px;
                height: 159px;
                left: 25px;
                top: 30px;
                background: white;
                border-radius: 8px;
                color:#333;
                padding:20px;
                display:flex;
                align-items:center;
                justify-content: center;
                font-size:18px;
                transition: transform 1s ease;
                z-index: 2;

            }
        }
        .envelope.open .flap{
            transform:Rotatex(180deg);
        }
        .envelope.open .letter{
            transform: translatey(-120px);
        }
        .button{
            margin-top: 15px;
            padding:12px 28px;
            border: none;
            border-radius:25px;
            background:white;
            color:#ff4f81;
            font-size: 16px;
            font-weight:bold;
            cursor: pointer;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }
        button:hover{
            transform: scale(1.05);
        }

    </style>
</head>
<body>
<div class="container">
    <h1> une reponse </h1>
    <div class="sous titre">J'AI UNE QUESTION...</div>
    <div class="envelope" id="envelope">
        <div class="letter">tu m'aimes?</div>
        <div class="envelope-body">
            <div class="left-fold"></div>
            <div clqss="right-fold"></div>
            <div class="heart">❤TU M'AIME?</div>
            <div class="buttons">
                <button class="OUI" id="OUI">OUI❤️</button>
                <button class="NON" id="NON" onclick="cliqueNON()">NON!!!</button>
            </div>
        </div>
        <div class="flap"></div>
    </div>
    <div class="instruction">clique sur l'envelope❤️</div>
    <button onclick="ouvrir()">ouvrir</button>
</div>
<script>
    function cliqueNON() {
        alert("JE SAVAIS 😠  👿 💢");
    }
    function ouvrir() {
        const envelope=document.getElementById("envelope");
        envelope.classList.toggle("open");

    }
    const boutonOUI = document.getElementById("OUI");
    boutonOUI.addEventListener("mouseenter", function () {
     const largeur = window.innerWidth;
     const hauteur = window.innerHeight;
     const nouvelleX = Math.random() * (largeur - boutonOUI.offsetWidth);
     const nouvelleY = Math.random() * (hauteur - boutonOUI.offsetHeight);
     boutonOUI.style.left = nouvelleX + "px";
     boutonOUI.style.top = nouvelleY + "px";
    });
</script>
</body>
</html>
